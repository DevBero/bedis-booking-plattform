# Deploy to production (docs/HOSTING.md Schritt 5): manual only (Actions → Deploy → Run workflow), there is no
# staging to catch mistakes from a push. AWS access via OIDC and the role bedi-github-deploy
# (infra/lib/github-stack.ts); no stored keys. Until the GitHub environment "production" has the variable
# AWS_DEPLOY_ROLE_ARN (TICKET.md), the job is skipped instead of failing.
name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    env:
      ENV_NAME: production
      ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: AWS not set up yet
        if: env.ROLE == ''
        run: echo "::notice::AWS_DEPLOY_ROLE_ARN is not set for this environment – deploy skipped (TICKET.md)"
      - uses: actions/checkout@v4
        if: env.ROLE != ''
      - uses: pnpm/action-setup@v4
        if: env.ROLE != ''
      - uses: actions/setup-node@v4
        if: env.ROLE != ''
        with:
          node-version: 22
          cache: pnpm
      - if: env.ROLE != ''
        run: pnpm install --frozen-lockfile
      - if: env.ROLE != ''
        run: pnpm typecheck && pnpm lint && pnpm test
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.ROLE != ''
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: eu-north-1
      # Infrastructure first (no-op when infra/ is unchanged), then build + upload + invalidate
      - if: env.ROLE != ''
        run: pnpm exec cdk deploy -c env=$ENV_NAME --all --require-approval never
      - if: env.ROLE != ''
        run: bash scripts/deploy-site.sh $ENV_NAME
